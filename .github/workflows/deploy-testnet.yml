name: Deploy Testnet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: stable

jobs:
  build-contract:
    name: Build Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32v1-none
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build contract
        run: cargo build --target wasm32v1-none --release
      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/*.wasm

  deploy-contract:
    name: Deploy Contract
    runs-on: ubuntu-latest
    needs: build-contract
    steps:
      - uses: actions/checkout@v4
      - name: Download WASM
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: ./contract-wasm
      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-linux-x86_64.tar.gz | tar xz
          sudo mv stellar /usr/local/bin/
      - name: Deploy contract
        env:
          STELLAR_SECRET: ${{ secrets.TESTNET_DEPLOYER_SECRET }}
          NETWORK: testnet
        run: |
          stellar keys add --global deployer "$STELLAR_SECRET"
          CONTRACT_ID=$(stellar contract deploy \
            --wasm ./contract-wasm/*.wasm \
            --source deployer \
            --network testnet)
          echo "CONTRACT_ID=$CONTRACT_ID" >> $GITHUB_ENV
      - name: Update environment
        run: echo "CONTRACT_ID=${{ env.CONTRACT_ID }}" >> $GITHUB_ENV

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: deploy-contract
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push orderbook
        uses: docker/build-push-action@v5
        with:
          context: ./orderbook
          push: true
          tags: ghcr.io/${{ github.repository }}/orderbook:${{ github.sha }}
      - name: Build and push keeper
        uses: docker/build-push-action@v5
        with:
          context: ./keeper
          push: true
          tags: ghcr.io/${{ github.repository }}/keeper:${{ github.sha }}
      - name: Build and push indexer
        uses: docker/build-push-action@v5
        with:
          context: ./indexer
          push: true
          tags: ghcr.io/${{ github.repository }}/indexer:${{ github.sha }}

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-contract
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_CONTRACT_ID: ${{ env.CONTRACT_ID }}
          NEXT_PUBLIC_ORDER_BOOK_URL: ${{ secrets.ORDER_BOOK_URL }}
          NEXT_PUBLIC_RPC_URL: ${{ secrets.RPC_URL }}
          NEXT_PUBLIC_HORIZON_URL: ${{ secrets.HORIZON_URL }}
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'