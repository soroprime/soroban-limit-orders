[workspace]
resolver = "2"
members = [
    "limit_order",
    "limit_order_tests",
    "mock_dex",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/yourorg/soroban-limit-orders"

[workspace.dependencies]
soroban-sdk = { version = "28.0.0" }

# Optimized WASM output for Soroban contracts.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
# Required by stellar-cli / soroban-sdk 28 to prevent silent integer overflow.
overflow-checks = true